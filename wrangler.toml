# Cloudflare Pages configuration for THE BUTTON.
# The "name" must match your Cloudflare Pages project name.
# Non-secret values live here. Secrets are set in the Cloudflare dashboard.

name = "the-button"
compatibility_date = "2025-06-01"
pages_build_output_dir = "./public"

[vars]
# Public base URL without trailing slash, e.g. "https://thebutton.example"
SITE_URL = "https://DEINE-DOMAIN-HIER.pages.dev"
# Google OAuth client ID (public value, not a secret)
GOOGLE_CLIENT_ID = "DEINE-GOOGLE-CLIENT-ID-HIER"
# Cloudflare Turnstile site key (public value, not a secret)
TURNSTILE_SITE_KEY = "DEIN-TURNSTILE-SITE-KEY-HIER"

[[d1_databases]]
binding = "DB"
database_name = "the-button-db"
database_id = "DEINE-D1-DATABASE-ID-HIER"
migrations_dir = "migrations"
