<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#040406"/>
  <circle cx="600" cy="315" r="160" fill="url(#rainbow)"/>
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#f5f5f7" text-anchor="middle" letter-spacing="8">THE BUTTON</text>
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="24" fill="#8d8d99" text-anchor="middle" letter-spacing="4">ONE WORLD. ONE BUTTON.</text>
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
