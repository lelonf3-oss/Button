<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BUTTON</title>
  <meta name="description" content="A global internet experiment. One world, one button. Press it and increase the global counter.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="THE BUTTON">
  <meta property="og:description" content="A global internet experiment. One world, one button.">
  <meta property="og:image" content="/design/og-image-template.svg">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="stage">
    <header class="top">
      <h1 class="title">THE BUTTON</h1>
      <p class="counter">
        <span id="counter-total" class="counter-total-bump">0</span>
        <span class="counter-sep">/</span>
        <span id="counter-goal" class="counter-goal">1,000</span>
      </p>
      <p class="counter-label">GLOBAL CLICKS</p>
      <div class="progress">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </header>

    <div id="button-wrap" class="button-wrap" data-ready="true">
      <div class="glow"><div class="spin"></div></div>
      <div class="btn-side"><div class="spin"></div></div>
      <button id="the-button" class="btn-top" aria-label="Press the button">
        <div class="tint"></div>
        <div class="gloss"></div>
        <div class="bounce"></div>
      </button>
    </div>

    <div class="info">
      <p class="tagline">ONE WORLD. ONE BUTTON.</p>
      <p id="milestone-line" class="milestone"></p>
      <p id="reached-line" class="reached" hidden></p>
      
      <div class="actions">
        <div id="auth-out">
          <!-- Login link to the function route -->
          <a id="sign-in" href="/api/auth/google/login" class="link-btn link-btn--primary">Sign in with Google</a>
        </div>
        <div id="auth-in" hidden>
          <p id="user-line" class="user-line"></p>
          <button id="sign-out" class="link-btn link-btn--quiet">Sign out</button>
        </div>
        
        <div id="turnstile-box" class="turnstile-box"></div>
        <p id="status" class="status" data-tone="info" role="status" aria-live="polite"></p>
        
        <div class="packages">
          <button id="buy-toggle" class="link-btn" aria-expanded="false" aria-controls="packages">Get more clicks</button>
          <div id="packages" hidden>
            <div id="package-list" class="package-list"></div>
            <p class="fine">One free click per Google account. Max one press per day (UTC). Paid credits never expire.</p>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <nav class="footer-nav">
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
        <a href="/payments.html">Payments</a>
        <a href="/imprint.html">Imprint</a>
      </nav>
    </footer>
  </main>
  <noscript><p class="noscript">You need JavaScript to press the button.</p></noscript>
  
  <!-- app.js uses ES modules -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
